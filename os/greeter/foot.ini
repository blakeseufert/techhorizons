# Terminal the login screen runs in.
#
# The background MUST be set here. Textual does not write every cell -- a rail
# it has not drawn into, the gap around the box -- and whatever it leaves alone
# shows the terminal's own default, which for foot is a #242424 grey. Under
# cage the greeter happened to cover enough of the screen to hide that; under
# Hyprland the lock screen came up with grey rails, no box border and no
# labels, which read like a broken repaint and cost a lot of time to chase.
#
# Setting it here fixes both, because the terminal's default background IS
# ink-deep and unpainted cells are simply correct.
#
# A chunky font on purpose: fewer columns means the banner fills more of the
# top third, and it reads as deliberate rather than as a tiny console.
font=JetBrains Mono:size=18
pad=0x0

[cursor]
style=underline

[scrollback]
lines=0

# foot 1.28 dropped [colors] for [colors-dark] / [colors-light]; a plain
# [colors] is a hard config error and foot then starts with its own defaults.
# Both are set to the same ink-deep because this terminal has one look: which
# section foot picks depends on whether the compositor advertises a preferred
# scheme, and cage advertises none.
[colors-dark]
background=141615
foreground=DBE4C6

[colors-light]
background=141615
foreground=DBE4C6

# No [csd] block. foot can draw its own titlebar with a close button, and the
# config parses, but Hyprland always claims server-side decorations over the
# xdg-decoration protocol and draws no titlebar of its own -- so the setting is
# read and then ignored. There is no Hyprland option to hand decoration back to
# the client; the whole `decoration:` tree is blur and shadows.
#
# The dock has a close button instead, which has the advantage of working for
# every window rather than only for terminals.
