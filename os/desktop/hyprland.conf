# Tech Horizons OS — Hyprland configuration.
#
# This is an appliance, not a desktop. There are deliberately NO workspaces,
# no window spawning keybinds, no terminal, no app launcher and no way to
# reach a settings panel. A student cannot arrange themselves into a broken
# state, because there is nothing to arrange.
#
# Lives in /opt and is passed with `Hyprland -c`, so it is not user-editable.

monitor = , preferred, auto, 1

# --- what starts with the session ---------------------------------------
# The wallpaper is part of the design, not decoration -- start it before
# anything else so a student never sees a bare grey root.
exec-once = /opt/techhorizons/desktop/wallpaper.sh
exec-once = /opt/techhorizons/desktop/autostart.sh

# --- input ---------------------------------------------------------------
# These are laptops. Tap-to-click and natural scroll are what students expect
# from the Chromebooks and phones they already use.
input {
    kb_layout = au
    # No Ctrl+Alt+Fn. A student with Windows habits reaching for Alt+F4 lands
    # on Ctrl+Alt+F4 often enough, and what is there is a black screen with a
    # login prompt and no way back they could know. It is also the one route
    # around the lock screen. The gettys still exist for a technician with a
    # serial console or SSH; they are simply not on the keyboard.
    kb_options = srvrkeys:none
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
    sensitivity = 0
}

# --- look ----------------------------------------------------------------
# Restrained on purpose: this has to feel deliberate on a decade-old laptop,
# and heavy blur is the fastest way to make old hardware feel slow.
general {
    # Generous gaps on purpose: the wallpaper is part of the design, so
    # windows sit on it as cards rather than covering it edge to edge.
    gaps_in = 10
    # top right bottom left -- extra at the bottom so nothing tucks under the dock.
    # Commas, not spaces: space-separated values are read as ONE number and
    # applied to all four sides, so this silently gave 12 all round and the
    # extra clearance above the dock never existed.
    gaps_out = 12,12,22,12
    border_size = 1
    # Warm accent from the design; inactive borders nearly disappear against
    # the artwork rather than drawing a hard charcoal frame on it.
    col.active_border = rgba(FF6846bb)
    col.inactive_border = rgba(282A2966)

    # Horizontal scrolling tiling: windows sit on an infinitely growing tape of
    # columns rather than being bisected. Built in from Hyprland 0.54 -- 0.51
    # accepts the name and silently falls back to dwindle, which is why the ISO
    # is built against edge.
    layout = scrolling

    # Drag any window edge to resize, no modifier needed.
    resize_on_border = true
    # 12 was enough to catch a corner and almost nothing else: an edge is
    # only as grabbable as this number is wide.
    extend_border_grab_area = 24
    hover_icon_on_border = true
}

scrolling {
    # In the design the app window sits inset with the wallpaper visible
    # around it, so a lone column must NOT fill the screen -- with
    # fullscreen_on_one_column = true it does, and the artwork disappears.
    # 0.66 keeps a single window comfortable on a 1366x768 ex-Chromebook
    # (~900px) while still showing the wallpaper; two columns fill the tape.
    column_width = 0.66
    fullscreen_on_one_column = false
    follow_focus = true
    focus_fit_method = 0
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    direction = right
}

decoration {
    # 16px to match the window radius drawn in the design.
    rounding = 16
    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(0000007a)
    }
}

animations {
    enabled = true
    bezier = ease, 0.22, 0.8, 0.22, 1
    animation = windows, 1, 4, ease, slide
    animation = fade, 1, 4, ease
    animation = border, 1, 6, ease
    # No workspace animation -- there are no workspaces to animate.
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # Never leave a student staring at an empty desktop: there isn't one.
    disable_autoreload = true
    focus_on_activate = true
}

# --- window rules --------------------------------------------------------
# Hyprland 0.53 replaced the old comma-separated windowrule/windowrulev2 lines
# with this block form: matchers are `match:<prop>`, effects are plain fields.
# The old syntax fails with "invalid field float: missing a value".
#
# MATCH ON class, NOT title. The wiki is explicit that static effects are
# evaluated once when the window opens, so title/class matching always sees
# initialTitle/initialClass -- and chromium sets its real title only after the
# page loads, so a title rule silently matches nothing.
#
# In --app mode chromium derives the app_id from the URL, so these strings are
# a function of the file paths. If a surface moves to th-hub over http, its
# class changes with it and these rules must be updated.
#
# Everything not named here joins the scrolling tape as a column.

windowrule {
    # The coursework drawer. Only the things that must be true the instant it
    # maps live here -- desktop/drawer.sh does the placing, because it also has
    # to reserve the space and stash the window without closing it.
    #
    # Both classes: chromium sets its app-id from the --app URL unless --class
    # takes effect, and which one you get varies by build.
    name = course-drawer
    match:class = ^(th-course|chrome-__opt_techhorizons_desktop_course\.html-Default)$

    float = true
    pin = true
    # A border to grab: the drawer is resized by dragging its right edge, and
    # with border_size 0 there is nothing to aim at. Width is clamped between
    # 18% and 50% by desktop/drawer-sync.sh.
    border_size = 2
    animation = slide left
}

windowrule {
    # The lock screen: fullscreen, pinned, always focused. Not a real session
    # lock -- see desktop/lock.sh for why that trade was made.
    name = lock-screen
    # The lock runs foot inside cage, so the window Hyprland sees is cage's --
    # and cage reports its class as "wlroots", not "cage". Nothing else here
    # is a wlroots compositor.
    match:class = ^(wlroots)$

    # foot asking for fullscreen itself is not enough -- as a floating window it
    # came up at foot's default size, a 700x500 box with the desktop clickable
    # around it, which is not a lock at all. Hyprland has to do the fullscreen.
    fullscreen = true
    pin = true
    stay_focused = true
    no_screen_share = true
}

windowrule {
    # Screenshot review pops centre-stage, above everything.
    name = screenshot-review
    match:class = ^(chrome-__opt_techhorizons_desktop_shot\.html-Default)$

    float = true
    size = monitor_w*0.7 monitor_h*0.76
    center = true
    stay_focused = true
}

# --- keybinds ------------------------------------------------------------
# Only what a laptop genuinely needs. No spawn, no kill, no workspaces.
bind = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Make the focused window bigger or smaller. Both the main and numpad keys,
# and with or without shift, because students will try all of them.
bind = SUPER, minus,      resizeactive, -10% 0
bind = SUPER, equal,      resizeactive,  10% 0
bind = SUPER, KP_Subtract, resizeactive, -10% 0
bind = SUPER, KP_Add,      resizeactive,  10% 0
bind = SUPER SHIFT, equal, resizeactive,  10% 0

# Drag to move or resize with the mouse.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Scroll along the tape of columns.
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
# Up and down too. The layout scrolls sideways so these rarely have anywhere to
# go, but a student pressing an arrow and getting nothing learns that arrows do
# not work, and stops trying the two that do.
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

# Toggle the course panel. The one shortcut worth teaching.
bind = SUPER, C, exec, /opt/techhorizons/desktop/drawer.sh

# The dock's popup panels. Each sits just above the dock, under the button
# that opened it, rather than floating in the middle of the screen where it
# reads as a window the student now has to deal with. 56 is the dock's 48 plus
# the gap.
windowrule {
    name = panel-clock
    match:class = ^(th-panel-clock)$

    float = true
    pin = true
    size = 380 330
    move = monitor_w*0.5-190 monitor_h-386
    border_size = 1
}

windowrule {
    name = panel-network
    match:class = ^(th-panel-network)$

    float = true
    pin = true
    size = 760 470
    move = monitor_w-788 monitor_h-526
    border_size = 1
}

windowrule {
    # btop needs room to be readable; the others are glanceable popups.
    name = panel-system
    match:class = ^(th-panel-system)$

    float = true
    pin = true
    size = 1000 640
    move = monitor_w*0.5-500 monitor_h*0.5-360
    border_size = 1
}

windowrule {
    name = panel-display
    match:class = ^(th-panel-display)$

    float = true
    pin = true
    size = 520 300
    move = monitor_w-548 monitor_h-356
    border_size = 1
}

# The pointer: Lucide's mouse-pointer-2, compiled to a hyprcursor theme at
# install time from desktop/assets/cursor.
#
# XCURSOR_* is set alongside it because hyprcursor only covers the cursor the
# compositor draws. Clients that draw their own -- GTK, and Chromium when it
# is not using the cursor-shape protocol -- read the XCursor variables, and
# without them the pointer changes shape as it crosses into a browser window.
env = HYPRCURSOR_THEME,TechHorizons
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,TechHorizons
env = XCURSOR_SIZE,24

# Lock the screen. Also a button next to the clock, so nobody has to know this.
bind = SUPER, L, exec, /opt/techhorizons/desktop/lock.sh

# Screenshot straight into evidence -- students do this constantly.
bind = , Print, exec, /opt/techhorizons/desktop/screenshot.sh
